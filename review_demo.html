async function __aitcUnlockDerive(password, saltB64, iterations) {
  const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
  const baseKey = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function __aitcDecryptToBytes(key, ivB64, ciphertextB64) {
  const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
  const ciphertext = Uint8Array.from(atob(ciphertextB64), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
  return new Uint8Array(plain);
}

function __aitcStoredPassword() {
  return sessionStorage.getItem("aitcreview_pw") || localStorage.getItem("aitcreview_pw");
}

async function __aitcTryUnlock(password) {
  const payload = window.__AITC_PAYLOAD__;
  try {
    const key = await __aitcUnlockDerive(password, payload.salt, payload.iterations);
    const bytes = await __aitcDecryptToBytes(key, payload.iv, payload.ciphertext);
    const html = new TextDecoder().decode(bytes);
    return html;
  } catch (e) {
    return null;
  }
}

async function __aitcSubmit(remember) {
  const pwInput = document.getElementById("aitc-pw");
  const password = pwInput.value;
  const errEl = document.getElementById("aitc-err");
  const decoded = await __aitcTryUnlock(password);
  if (decoded === null) {
    errEl.textContent = "Incorrect password.";
    errEl.style.display = "block";
    return;
  }
  sessionStorage.setItem("aitcreview_pw", password);
  if (remember) localStorage.setItem("aitcreview_pw", password);
  document.open();
  document.write(decoded);
  document.close();
}

window.addEventListener("DOMContentLoaded", async () => {
  const cached = __aitcStoredPassword();
  if (cached) {
    const decoded = await __aitcTryUnlock(cached);
    if (decoded !== null) {
      document.open();
      document.write(decoded);
      document.close();
      return;
    }
  }
  const form = document.getElementById("aitc-form");
  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    __aitcSubmit(document.getElementById("aitc-remember").checked);
  });
});
</script>
