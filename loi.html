<style>
:root{
  --yale:#00356b; --yale-ink:#0b2547; --link:#286dc0; --wash:#eef3fa;
  --ink:#19243a; --body:#3a4458; --muted:#6b7588; --line:#e3e8f0; --line-2:#d3dbe7;
  --warm:#c2410c; --warm-bg:#fff4ec;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--body);font:15px/1.6 var(--sans);font-feature-settings:"tnum"}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}

/* top + hero: white page with a soft Yale-blue glow, like the RFA page */
.top{position:relative;overflow:hidden;background:
  radial-gradient(60% 120% at 15% 0%,#d9e6f7 0%,transparent 60%),
  radial-gradient(50% 110% at 90% 10%,#e6edf8 0%,transparent 65%),#fff}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(transparent,#fff)}
nav{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 32px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:baseline;gap:2px;font:700 22px var(--sans);letter-spacing:-.02em;color:var(--yale)}
.brand i{font-style:normal;font-weight:500;color:var(--link)}
.brand-sub{font-size:12px;color:var(--muted);border-left:1px solid var(--line-2);padding-left:12px;line-height:1.25}
nav .right{margin-left:auto;font-size:14px;color:var(--ink)}
.hero{position:relative;z-index:1;text-align:center;max-width:980px;margin:0 auto;padding:34px 32px 30px}
.kicker{font:400 22px/1.3 var(--serif);color:var(--ink);margin:0}
h1{font:600 52px/1.08 var(--serif);color:var(--ink);letter-spacing:-.01em;margin:10px 0 14px}
.meta{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 26px;font-size:14px;color:var(--body);margin:0}
.meta b{color:var(--ink);font-weight:600}

/* signature: the review pipeline as a timeline; each stop filters the table */
.flow{position:relative;z-index:1;max-width:980px;margin:26px auto 0;padding:0 32px 34px}
.flow ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.flow ol::before{content:"";position:absolute;left:12.5%;right:12.5%;top:13px;height:2px;background:var(--line-2)}
.flow li{position:relative;display:flex;justify-content:center;text-align:center}
.flow button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 8px;border-radius:10px}
.flow .dot{width:12px;height:12px;margin-top:8px;border-radius:50%;background:#fff;border:2px solid var(--link);position:relative;z-index:1;transition:transform .15s}
.flow .n{font:600 30px/1 var(--serif);color:var(--yale);margin-top:6px}
.flow .l{font-size:13px;color:var(--body);max-width:160px}
.flow li.warm .dot{background:var(--warm);border-color:var(--warm)}
.flow li.warm .n{color:var(--warm)}
.flow button:hover .dot,.flow button[aria-pressed="true"] .dot{transform:scale(1.35);background:var(--link)}
.flow li.warm button:hover .dot,.flow li.warm button[aria-pressed="true"] .dot{background:var(--warm)}
.flow button[aria-pressed="true"] .l{color:var(--ink);font-weight:600}

main{max-width:1180px;margin:0 auto;padding:8px 32px 72px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.tools h2{font:600 26px var(--serif);color:var(--ink);margin:0 auto 0 0}
.tools input,.tools select{font:inherit;font-size:14px;height:38px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;background:#fff;color:var(--ink)}
.tools input{width:300px}
.linkbtn{all:unset;cursor:pointer;font-size:13px;color:var(--link);padding:4px 2px}
.linkbtn:hover{text-decoration:underline}
.count{font-size:13px;color:var(--muted);margin:0 0 10px}

/* table: dark Yale header like the RFA funding table */
.table{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.thead,.row{display:grid;grid-template-columns:28px minmax(0,1fr) 200px 200px;gap:20px;align-items:start;padding:16px 22px}
.thead{background:var(--yale-ink);color:#fff;font-size:13px;font-weight:600;padding-top:13px;padding-bottom:13px}
.item+.item{border-top:1px solid var(--line)}
.row{cursor:pointer;transition:background .12s}
.row:hover{background:#f7f9fc}
.item.open>.row{background:var(--wash)}
.caret{width:22px;height:22px;margin-top:3px;display:grid;place-items:center;color:var(--link);transition:transform .2s}
.caret svg{width:12px;height:12px}
.item.open .caret{transform:rotate(90deg)}
.title{font:600 18px/1.35 var(--serif);color:var(--yale)}
.by{font-size:14px;color:var(--ink);margin-top:3px}
.by span{color:var(--muted)}
.kws{font-size:13px;color:var(--muted);margin-top:4px}
.kws span+span::before{content:" · "}
.site{font-size:14px;color:var(--ink)}
.site small,.st small{display:block;font-size:13px;color:var(--muted)}
.st{font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.st small.stage{font-size:12px;letter-spacing:.02em}
.state{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--link)}
.state.full::before{background:var(--yale)}
.state.declined{color:var(--muted);font-weight:500}
.state.declined::before{background:#b8c0cc}
.flag{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:600;color:var(--warm);background:var(--warm-bg);border-radius:999px;padding:1px 10px}

/* expanded detail with tabs */
.detail{display:none;padding:0 22px 22px 70px;background:var(--wash)}
.item.open .detail{display:block}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;font-size:14px;color:var(--muted);padding:12px 12px 10px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--yale);border-bottom-color:var(--yale);font-weight:600}
.tabs sup{font-size:11px;color:var(--muted);margin-left:2px}
.pane{padding:20px 22px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}
.cols h4,.pane h4{font:600 13px var(--sans);color:var(--ink);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:14px}
dt{color:var(--muted)}
dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.dash{color:#aab2c0}
.id{font:12px var(--mono);color:var(--muted)}
.note{margin-top:22px;padding:12px 16px;border-left:3px solid var(--warm);background:var(--warm-bg);border-radius:0 8px 8px 0;font-size:14px;color:var(--ink)}
.note b{color:var(--warm);font-weight:600}
.qa{list-style:none;margin:0;padding:0}
.qa li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.qa li:first-child{border-top:0;padding-top:0}
.qa .q{color:var(--muted)}
.qa .a{color:var(--ink);white-space:pre-wrap}
.qa .req{color:var(--warm)}
table.mini{width:100%;border-collapse:collapse;font-size:14px}
table.mini th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
table.mini td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top}
table.mini tr:last-child td{border-bottom:0}
details.rv summary{cursor:pointer;color:var(--link);font-size:13px;margin-top:2px}
details.rv .qa{margin-top:8px}
pre.raw{margin:0;max-height:460px;overflow:auto;background:#0b1830;color:#d6e2f5;font:12px/1.5 var(--mono);padding:16px;border-radius:10px}
.empty-state{padding:44px;text-align:center;color:var(--muted)}
footer{max-width:1180px;margin:0 auto;padding:0 32px 40px;font-size:12px;color:var(--muted)}

@media (max-width:900px){
  h1{font-size:38px}
  .flow ol{grid-template-columns:repeat(2,1fr);row-gap:22px}
  .flow ol::before{display:none}
  .thead{display:none}
  .row{grid-template-columns:22px minmax(0,1fr);gap:6px 12px}
  .row>.site,.row>.st{grid-column:2}
  .detail{padding:0 12px 14px}
  .cols{grid-template-columns:1fr}
  .qa li{grid-template-columns:1fr;gap:2px}
  .tools input{width:100%}
  .brand-sub{display:none}
  nav{padding:18px 20px}
  nav .right{font-size:13px;text-align:right}
  .hero{padding:20px 20px 24px}
  table.mini{display:block;overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* stage switch + COI filter */
.switch{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:#fff}
.switch a{font-size:13px;font-weight:600;color:var(--muted);padding:6px 14px;border-radius:999px;text-decoration:none}
.switch a:hover{color:var(--ink)}
.switch a[aria-current="page"]{background:var(--yale);color:#fff}
.coi-toggle{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--warm);background:var(--warm-bg);border:1px solid transparent;border-radius:999px;padding:7px 14px}
.coi-toggle[aria-pressed="true"]{border-color:var(--warm)}
.flow .u{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.flow ol.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.flow ol.n3::before{left:16.7%;right:16.7%}
.ctx{font-size:13px;color:var(--muted);margin:0 0 14px}
</style>
</head>

const STAGE = "loi"; // "loi" | "full"

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const human = s => { s = String(s || "").replace(/_/g, " "); return s.charAt(0).toUpperCase() + s.slice(1); };

const val = v => (v === null || v === undefined || v === "") ? '<span class="dash">—</span>' : esc(v);
const COST = /cost/i;
const money = n => "$" + Number(n).toLocaleString("en-US");
const CARET = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

// the platform calls the full stage "application" on documents, reviews and events
const KEY = STAGE === "loi" ? "loi" : "application";
const inStage = x => x.stage === KEY;
const hasFull = s => !!(s.full && s.full.submitted_at);
const SUBS = STAGE === "loi" ? ALL : ALL.filter(hasFull);
const revsOf = s => (s.reviews||[]).filter(inStage);
const reviewsDone = s => { const r = revsOf(s); return r.length > 0 && r.every(x => x.status === "submitted"); };

function value(a){
  // show any value present; the dev package can have text with answered=false
  if (a.kind === "number" && a.value_number != null && a.value_number !== "") {
    const f = COST.test(a.label || "") ? money : (x => x);
    return f(a.value_number) + (a.value_number_end != null && a.value_number_end !== "" ? " – " + f(a.value_number_end) : "");
  }
  const opts = (a.option_labels||[]).join(", ");
  return [a.text, a.value_text, opts, a.value_date].find(v => v != null && String(v).trim() !== "") ?? "";
}
function coiSelfReport(s){
  const a = ((s.loi||{}).answers||[]).find(x => /conflicts? of interest/i.test(x.label || ""));
  const v = a ? String(value(a)).trim() : "";
  return v && !/^(none|n.a|no)([^a-z]|$)/i.test(v) ? v : "";
}
function status(s){
  if (STAGE === "full") return {label:human(s.full.status), cls:"full"};
  const st = (s.loi||{}).status;
  if (st === "invited") return {label:"Invited to full application", cls:"full"};
  if (st === "not_invited" || st === "declined") return {label:"Not invited", cls:"declined"};
  return {label:human(st || s.pipeline_stage), cls:"loi"};
}

function team(s){
  const kp = ((s.loi||{}).answers||[]).find(a => a.label === "Other Key Personnel");

  const low = kpText.toLowerCase();

function panes(s){

  const decisions = STAGE === "loi"
    ? [["Status", val(human(loi.status))],["Submitted", val(date(loi.submitted_at))],["Eligibility", val(human((loi.eligibility||{}).status))],["Overall score", val(loi.overall_score)],["Decided", val(date(loi.decided_at))],["Decision note", val(loi.decision_note_md)]]
    : [["Status", val(human(full.status))],["Submitted", val(date(full.submitted_at))],["Extended to", val(date(full.extended_to))],["Admin note", val(full.admin_note)],["Decision", val(human(full.decision))],["Overall score", val(full.overall_score)]];
  const overview = '<div class="cols">'
    + '<div><h4>Principal investigator</h4>' + dl([["Name", val(pi.name)],["Title", val(pi.title)],["Institution", val(pi.institution)],["Department", val(pi.department)],["Email", pi.email ? '<a href="mailto:' + esc(pi.email) + '">' + esc(pi.email) + '</a>' : val("")]]) + '</div>'
    + '<div><h4>Team</h4>' + team(s) + '</div>'
    + '<div><h4>' + (STAGE === "loi" ? "Letter of intent" : "Full application") + '</h4>' + dl(decisions) + '</div>'
    + '</div>'
    + (coi ? '<div class="note"><b>COI self-reported in LOI.</b> ' + esc(coi) + '</div>' : '')
    + '<p style="margin:18px 0 0" class="id">Application ' + esc(s.id) + ' · ' + esc(s.rfa_code) + ' · ' + esc(s.program_name) + ' · created ' + esc(date(s.created_at)) + '</p>';
  const docs = (s.documents||[]).filter(inStage).map(d => '<tr><td>' + esc(d.requirement_label) + '</td><td>' + esc(d.filename) + '</td><td>' + (Math.round((d.size_bytes||0)/102.4)/10) + ' KB</td><td>' + esc(date(d.uploaded_at)) + '</td></tr>');
  const revs = revsOf(s).map(r => '<tr><td>' + esc(r.reviewer_name)
      + ((r.answers||[]).some(a => value(a) !== "") ? '<details class="rv"><summary>Read review</summary>' + qa(r.answers) + '</details>' : '')
      + '</td><td>' + esc(human(r.status)) + '</td><td>' + esc(date(r.assigned_at)) + '</td><td>' + esc(date(r.due_date)) + '</td><td>' + val(date(r.submitted_at)) + '</td></tr>');
  const events = (s.events||[]).filter(inStage).map(e => '<tr><td>' + esc(date(e.created_at)) + '</td><td>' + esc(human(e.from_status) || "—") + ' → ' + esc(human(e.to_status)) + '</td><td>' + val(e.note) + '</td></tr>');
  const out = [["Overview", overview, null]];
  if (STAGE === "loi") out.push(["LOI form", qa(loi.answers), null]);
  else out.push(["Full application form", qa(full.answers), null], ["LOI form", qa(loi.answers), null]);
  out.push(["Documents", table(["Requirement","File","Size","Uploaded"], docs), docs.length]);
  out.push(["Reviews", table(["Reviewer","Status","Assigned","Due","Submitted"], revs), revs.length]);
  out.push(["History", table(["Date","Change","Note"], events), null]);
  out.push(["Raw JSON", '<pre class="raw">' + esc(JSON.stringify(s, null, 2)) + '</pre>', null]);
  return out;
}
function detail(s){
  const p = panes(s), uid = s.id.slice(0, 8);
  return '<div class="panel"><div class="tabs" role="tablist">'
    + p.map(([t,,n], i) => '<button role="tab" id="t-' + uid + '-' + i + '" aria-controls="p-' + uid + '-' + i + '" aria-selected="' + (i === 0) + '" tabindex="' + (i === 0 ? 0 : -1) + '">' + t + (n ? '<sup>' + n + '</sup>' : '') + '</button>').join("")
    + '</div>' + p.map(([,h], i) => '<div class="pane" role="tabpanel" id="p-' + uid + '-' + i + '" aria-labelledby="t-' + uid + '-' + i + '"' + (i ? ' hidden' : '') + '>' + h + '</div>').join("") + '</div>';
}
function wireTabs(root){
  const tabs = [...root.querySelectorAll('[role="tab"]')];
  const pick = t => { tabs.forEach(x => { const on = x === t; x.setAttribute("aria-selected", on); x.tabIndex = on ? 0 : -1; root.querySelector("#" + x.getAttribute("aria-controls")).hidden = !on; }); t.focus(); };
  tabs.forEach((t, i) => {
    t.addEventListener("click", e => { e.stopPropagation(); pick(t); });
    t.addEventListener("keydown", e => { if (e.key === "ArrowRight") pick(tabs[(i + 1) % tabs.length]); if (e.key === "ArrowLeft") pick(tabs[(i - 1 + tabs.length) % tabs.length]); });
  });
}

const title = s => (s.loi||{}).project_title || "(untitled)";
const hay = s => { const p = s.pi||{}; return [title(s), p.name, p.institution, s.program_name, ...(s.keywords||[]).map(k => k.name), ...(s.collaborators||[]).map(c => c.name)].join(" ").toLowerCase(); };

// where applications are within this stage; each stop filters the table
const fullIs = st => s => (s.full||{}).status === st;
const STOPS = STAGE === "loi" ? [
  ["LOIs received", s => true],
  ["All LOI reviews in", reviewsDone],
  ["Invited to full application", s => (s.loi||{}).status === "invited"],
  ["Not invited", s => ["not_invited","declined"].includes((s.loi||{}).status)],
] : [
  ["Submitted, awaiting check", fullIs("submitted")],
  ["Ready for review", fullIs("ready_for_review")],
  ["Reviewers assigned", fullIs("reviewers_assigned")],
  ["All reviews in", reviewsDone],
];
let stop = -1, coiOnly = false;

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const site = document.getElementById("fSite").value;
  const rows = SUBS.filter(s => (!q || hay(s).includes(q)) && (!site || s.program_name === site) && (stop < 0 || STOPS[stop][1](s)) && (!coiOnly || coiSelfReport(s)));
  document.getElementById("count").textContent = rows.length === SUBS.length ? plural(SUBS.length, "application") : rows.length + " of " + plural(SUBS.length, "application");
  const list = document.getElementById("list");
  list.innerHTML = rows.length ? rows.map(s => {
    const S = status(s), p = s.pi || {}, n = revsOf(s).length;
    return '<div class="item" data-id="' + esc(s.id) + '"><div class="row" role="button" tabindex="0" aria-expanded="false">'
      + '<div class="caret">' + CARET + '</div>'
      + '<div><div class="title">' + esc(title(s)) + '</div>'
      + '<div class="by">' + esc(p.name) + ' <span>· ' + esc(p.institution) + '</span></div>'
      + '<div class="kws">' + (s.keywords||[]).map(k => '<span>' + esc(k.name) + '</span>').join("") + '</div></div>'
      + '<div class="site">' + esc(s.program_name) + '<small>' + plural(n, STAGE === "loi" ? "LOI reviewer" : "reviewer") + '</small></div>'
      + '<div class="st"><span class="state ' + S.cls + '">' + esc(S.label) + '</span>' + (coiSelfReport(s) ? '<span class="flag" title="' + esc(coiSelfReport(s)) + '">COI self-reported</span>' : '') + '</div>'
      + '</div><div class="detail"></div></div>';
  }).join("") : '<div class="empty-state">No applications match these filters. Clear the search or pick another stop above.</div>';
  list.querySelectorAll(".row").forEach(r => {
    const toggle = () => {
      const item = r.parentElement, d = item.querySelector(".detail");
      if (!d.innerHTML) { d.innerHTML = detail(SUBS.find(s => s.id === item.dataset.id)); wireTabs(d); }
      item.classList.toggle("open"); r.setAttribute("aria-expanded", item.classList.contains("open"));
    };
    r.addEventListener("click", toggle);
    r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  });
}

function init(){
  const loiPage = STAGE === "loi";
  document.getElementById(loiPage ? "swLoi" : "swFull").setAttribute("aria-current", "page");
  document.title = "aitcreview · " + (loiPage ? "Letters of intent" : "Full applications") + " · " + (RFA.code || "");
  document.getElementById("kicker").textContent = [RFA.code, RFA.cycle_year && ("Cycle " + RFA.cycle_year)].filter(Boolean).join(" · ");
  document.getElementById("h1").textContent = loiPage ? "Letters of intent" : "Full applications";
  document.getElementById("h2").textContent = loiPage ? "All LOIs" : "All full applications";
  document.getElementById("thStatus").textContent = loiPage ? "LOI outcome" : "Full application status";
  const sites = [...new Set(SUBS.map(s => s.program_name))].sort();
  document.getElementById("meta").innerHTML = [
    ["Current step", human(RFA.step) + (RFA.phase === "closed" ? " (submissions closed)" : "")],
    ["Reviewers per application", RFA.reviewers_per_application],
    ["Sites", sites.join(", ")],
  ].filter(([, v]) => v !== undefined && v !== null && v !== "").map(([k, v]) => '<span>' + esc(k) + ': <b>' + esc(v) + '</b></span>').join("");
  const flow = document.getElementById("flow");
  flow.innerHTML = STOPS.map(([l, f], i) => '<li><button aria-pressed="false" data-i="' + i + '"><span class="dot"></span><span class="n">' + SUBS.filter(f).length + '</span><span class="u">applications</span><span class="l">' + esc(l) + '</span></button></li>').join("");
  flow.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.i; stop = stop === i ? -1 : i;
    flow.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", +x.dataset.i === stop));
    render();
  }));
  sites.forEach(x => document.getElementById("fSite").insertAdjacentHTML("beforeend", '<option>' + esc(x) + '</option>'));
  const coiN = SUBS.filter(s => coiSelfReport(s)).length, coiBtn = document.getElementById("fCoi");
  if (coiN) { coiBtn.textContent = "COI self-reported · " + coiN; coiBtn.onclick = () => { coiOnly = !coiOnly; coiBtn.setAttribute("aria-pressed", coiOnly); render(); }; }
  else coiBtn.remove();
  ["q","fSite"].forEach(id => document.getElementById(id).addEventListener("input", render));
  document.getElementById("expandAll").onclick = () => document.querySelectorAll(".item:not(.open) .row").forEach(r => r.click());
  document.getElementById("collapseAll").onclick = () => document.querySelectorAll(".item.open .row").forEach(r => r.click());
  document.getElementById("foot").textContent = "aitcreview · generated from the platform export · " + (loiPage ? plural(SUBS.length, "LOI") : plural(SUBS.length, "full application")) + " · dev data: application content, reviews and dates are test placeholders, so status-history dates don't line up.";
  render();
}
init();
</script>
</body>
