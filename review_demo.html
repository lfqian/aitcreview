<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aitcreview · Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --yale:#00356b; --yale-ink:#0b2547; --link:#286dc0; --wash:#eef3fa;
  --ink:#19243a; --body:#3a4458; --muted:#6b7588; --line:#e3e8f0; --line-2:#d3dbe7;
  --warm:#c2410c; --warm-bg:#fff4ec; --ok:#17603a; --ok-bg:#e9f6ee;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--body);font:15px/1.6 var(--sans);font-feature-settings:"tnum"}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

.top{position:relative;overflow:hidden;background:
  radial-gradient(60% 120% at 15% 0%,#d9e6f7 0%,transparent 60%),
  radial-gradient(50% 110% at 90% 10%,#e6edf8 0%,transparent 65%),#fff}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,#fff)}
nav{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:22px 32px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:baseline;gap:2px;font:700 22px var(--sans);letter-spacing:-.02em;color:var(--yale)}
.brand i{font-style:normal;font-weight:500;color:var(--link)}
.brand .role{font-weight:500;color:var(--muted);margin-left:8px;font-size:16px;letter-spacing:0}
.brand-sub{font-size:12px;color:var(--muted);border-left:1px solid var(--line-2);padding-left:12px;line-height:1.25}
nav .right{margin-left:auto;font-size:14px;color:var(--ink)}
.hero{position:relative;z-index:1;text-align:center;max-width:980px;margin:0 auto;padding:22px 32px 20px}
.kicker{font:400 22px/1.3 var(--serif);color:var(--ink);margin:0}
h1{font:600 46px/1.1 var(--serif);color:var(--ink);letter-spacing:-.01em;margin:8px 0 6px}
.stats{position:relative;z-index:1;max-width:760px;margin:12px auto 0;padding:0 32px 30px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats div{display:flex;flex-direction:column;align-items:center;gap:2px}
.stats .n{font:600 34px/1 var(--serif);color:var(--yale)}
.stats .l{font-size:13px;color:var(--body)}
.stats .u{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats .warm .n{color:var(--warm)}

main{max-width:1240px;margin:0 auto;padding:8px 32px 72px}
h2.sec{font:600 26px var(--serif);color:var(--ink);margin:0 0 4px}
.sub{font-size:13px;color:var(--muted);margin:0 0 14px}

.table{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.thead,.row{display:grid;grid-template-columns:minmax(0,1fr) 210px 120px 190px;gap:20px;align-items:start;padding:16px 22px}
.thead{background:var(--yale-ink);color:#fff;font-size:13px;font-weight:600;padding-top:13px;padding-bottom:13px}
.row{border-top:1px solid var(--line);cursor:pointer;transition:background .12s;color:inherit}
.row:first-of-type{border-top:0}
.row:hover{background:#f7f9fc;text-decoration:none}
.row .title{font:600 18px/1.35 var(--serif);color:var(--yale)}
.by{font-size:14px;color:var(--ink);margin-top:3px}
.by span{color:var(--muted)}
.kws{font-size:13px;color:var(--muted);margin-top:4px}
.kws span+span::before{content:" · "}
.cell{font-size:14px;color:var(--ink)}
.stagepill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 10px;background:var(--wash);color:var(--yale)}
.stagepill.full{background:var(--yale);color:#fff}
.state{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ink)}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:#b8c0cc}
.state.draft::before{background:var(--link)}
.state.submitted::before{background:var(--ok)}
.state.submitted{color:var(--ok)}
.state.conflict::before{background:var(--warm)}
.state.conflict{color:var(--warm)}
.empty-state{padding:44px;text-align:center;color:var(--muted)}

/* detail */
.crumb{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:14px}
.crumb a{font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.app h2{font:600 30px/1.2 var(--serif);color:var(--yale);margin:4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:16px}
.card h4,.rf h4{font:600 13px var(--sans);color:var(--ink);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:14px}
dt{color:var(--muted)}
dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.note{margin:0 0 16px;padding:12px 16px;border-left:3px solid var(--warm);background:var(--warm-bg);border-radius:0 8px 8px 0;font-size:14px;color:var(--ink)}
.note b{color:var(--warm);font-weight:600;display:block;margin-bottom:2px}
.qa{list-style:none;margin:0;padding:0}
.qa li{padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.qa li:first-child{border-top:0;padding-top:0}
.qa .q{color:var(--muted);font-size:13px;margin-bottom:2px}
.qa .a{color:var(--ink);white-space:pre-wrap}
.docs{list-style:none;margin:0;padding:0;font-size:14px}
.docs li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);color:var(--ink)}
.docs li:first-child{border-top:0}
.docs small{color:var(--muted)}
.docnote{font-size:12px;color:var(--muted);margin:8px 0 0}

/* review form */
.rf{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;border:1px solid var(--line-2);border-radius:14px;background:#fff;box-shadow:0 8px 30px -18px rgba(11,37,71,.35)}
.rf-head{position:sticky;top:0;z-index:2;background:var(--yale-ink);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.rf-head b{font:600 18px var(--serif)}
.rf-head span{font-size:12px;opacity:.8}
.rf form{padding:6px 22px 22px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.qb{padding:18px 0;border-top:1px solid var(--line)}
.qb:first-child{border-top:0}
.qb h3{font:600 17px/1.3 var(--serif);color:var(--ink);margin:0 0 2px}
.qb .crit{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.qb .num{color:var(--link);font-family:var(--sans);font-weight:600;margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:block;padding:7px 14px;border:1px solid var(--line-2);border-radius:999px;font-size:14px;font-weight:500;color:var(--ink);background:#fff}
.opt input:checked+span{background:var(--yale);border-color:var(--yale);color:#fff}
.opt input:focus-visible+span{outline:2px solid var(--link);outline-offset:2px}
.opt.warm input:checked+span{background:var(--warm);border-color:var(--warm)}
.opt input:disabled{cursor:not-allowed}
.opt input:disabled+span{opacity:.55}
.opt input:disabled:checked+span{opacity:.85}
.scale{display:grid;grid-template-columns:repeat(9,1fr);border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.scale label{position:relative;text-align:center;border-left:1px solid var(--line-2)}
.scale label:first-child{border-left:0}
.scale input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.scale span{display:block;padding:9px 0;font:600 16px var(--sans);color:var(--ink);background:#fff}
.scale label:hover span{background:var(--wash)}
.scale input:checked+span{background:var(--yale);color:#fff}
.scale input:focus-visible+span{outline:2px solid var(--link);outline-offset:-3px}
.scale input:disabled{cursor:not-allowed}
.scale input:disabled+span{opacity:.6}
.desc{font-size:13px;color:var(--muted);margin:6px 0 0;min-height:20px}
.desc b{color:var(--ink)}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;resize:vertical;min-height:76px;background:#fff}
textarea:disabled{background:#f6f8fb;color:var(--body)}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:12px 0 4px}
label.lbl small{font-weight:400;color:var(--muted)}
.cnt{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:2px}
.cnt.hot{color:var(--warm);font-weight:600}
.err{color:var(--warm);font-size:13px;font-weight:600;margin:6px 0 0}
.err:empty{display:none}
.bad textarea,.bad .scale,.bad .opt span{border-color:var(--warm)}
.coi-box{background:var(--warm-bg);border-radius:12px;padding:14px 16px;margin:14px 0 0}
.coi-box h3{font:600 17px var(--serif);color:var(--ink);margin:0 0 8px}
.coi-box .opt span{background:#fff}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:16px;border-top:1px solid var(--line)}
.btn{font:600 14px var(--sans);border-radius:999px;padding:10px 20px;border:1px solid var(--yale);cursor:pointer;background:#fff;color:var(--yale)}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--yale);color:#fff}
.btn.primary:hover{background:var(--yale-ink)}
.btn.warm{background:var(--warm);border-color:var(--warm);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.saved{font-size:13px;color:var(--muted);margin-left:auto}
.summary-err{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--warm-bg);color:var(--warm);font-size:13px;font-weight:600}
.summary-err ul{margin:4px 0 0;padding-left:18px;font-weight:500}
.summary-err a{color:var(--warm);text-decoration:underline}
.banner{margin:14px 22px 0;padding:10px 14px;border-radius:10px;font-size:14px}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.warm{background:var(--warm-bg);color:var(--warm)}
.banner.info{background:var(--wash);color:var(--yale)}

/* screens */
.msg{max-width:560px;margin:70px auto;text-align:center;padding:0 24px}
.msg h2{font:600 28px var(--serif);color:var(--ink);margin:0 0 10px}
.msg p{color:var(--body)}
.msg.bad h2{color:var(--warm)}
.demo{background:var(--yale-ink);color:#fff;font-size:13px;padding:8px 32px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.demo select{font:inherit;font-size:13px;border-radius:999px;border:1px solid #5a7aa3;background:#10315c;color:#fff;padding:3px 10px}
.demo button{all:unset;cursor:pointer;color:#cfe0f7;text-decoration:underline;font-size:12px}
.demo button:focus-visible,.demo select:focus-visible{outline:2px solid #fff}
dialog{border:0;border-radius:14px;padding:24px 26px;max-width:440px;box-shadow:0 20px 60px -10px rgba(11,37,71,.45);color:var(--body)}
dialog::backdrop{background:rgba(11,37,71,.45)}
dialog h3{font:600 20px var(--serif);color:var(--ink);margin:0 0 8px}
dialog .actions{border:0;justify-content:flex-end;padding-top:14px}
footer{max-width:1240px;margin:0 auto;padding:0 32px 40px;font-size:12px;color:var(--muted)}

.dlrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
#retrySlot .banner{margin:12px 0 0}
#retrySlot .why{opacity:.8}
.btn.sm{padding:6px 14px;font-size:13px}
.inv h2.invt{font:600 28px/1.25 var(--serif);color:var(--yale);margin:2px 0 10px}
.inv .abs{white-space:pre-wrap;color:var(--ink);font-size:15px;margin:0 0 6px}
.inv fieldset{border:0;padding:0;margin:18px 0 8px}
.inv legend.lbl{padding:0}
.inv .actions{margin-top:14px}
@media (max-width:980px){
  h1{font-size:34px}
  .thead{display:none}
  .row{grid-template-columns:minmax(0,1fr);gap:6px}
  .split{grid-template-columns:1fr}
  .rf{position:static;max-height:none;overflow:visible}
  .rf-head{position:static}
  nav{padding:18px 20px}
  .brand-sub{display:none}
  main{padding:8px 16px 56px}
  .hero{padding:16px 20px}
  .stats{padding:0 16px 24px}
  .demo{padding:8px 16px}
  .scale span{padding:11px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="demobar" class="demo" hidden>
  <span><b>Demo mode</b> — data stays in your browser</span>
  <label>Reviewer: <select id="who" aria-label="Switch demo reviewer"></select></label>
  <button id="resetDemo" type="button">Reset demo data</button>
</div>
<div class="top">
  <nav>
    <div class="brand">aitc<i>review</i><span class="role">· Reviewer</span></div>
    <div class="brand-sub">Artificial Intelligence and<br>Technology Collaboratories</div>
    <div class="right" id="navRight"></div>
  </nav>
  <header class="hero" id="hero" hidden>
    <p class="kicker">Application review</p>
    <h1 id="greet"></h1>
  </header>
  <section class="stats" id="stats" aria-label="Your review progress" hidden></section>
</div>
<main id="main" aria-live="polite"></main>
<footer id="foot">Your link is personal — please don't share it. Reviews are confidential.</footer>
<dialog id="dlg" aria-labelledby="dlgT"><h3 id="dlgT"></h3><p id="dlgB"></p>
  <div class="actions"><button class="btn" id="dlgNo" type="button">Cancel</button><button class="btn primary" id="dlgYes" type="button">Confirm</button></div></dialog>
<script>
const API_URL = ""; // Apps Script web app URL (ends in /exec)
const MOCK = null;          // null in production; sample data in the demo

const DESC = {1:"Exceptional",2:"Outstanding",3:"Excellent",4:"Very Good",5:"Good",6:"Satisfactory",7:"Fair",8:"Marginal",9:"Poor"};
const DESC_LONG = {1:"Exceptionally strong with essentially no weaknesses",2:"Extremely strong with negligible weaknesses",3:"Very strong with only some minor weaknesses",4:"Strong but with numerous minor weaknesses",5:"Strong but with at least one moderate weakness",6:"Some strengths but at least one moderate weakness",7:"Some strengths but with at least one major weakness",8:"A few strengths and a few major weaknesses",9:"Very few strengths and numerous major weaknesses"};
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Number(n).toLocaleString("en-US");
const fmtDate = s => s ? new Date(s).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
const STAGE_LABEL = {loi:"LOI", full:"Full"};
const FIELDS = ["coi_declared","coi_note","factor1_score","factor1_comment","factor2_score","factor2_comment","factor3","factor3_explanation","human_subjects","human_subjects_comment","overall_impact","summary","strengths","weaknesses"];

/* ---------------- backend (real or mock) ---------------- */
const params = new URLSearchParams(location.search);
const hashParams = () => new URLSearchParams(location.hash.replace(/^#/, ""));
const MAX_TEXT = 5000, MAX_TOTAL = 30000;
const TEXT_FIELDS = ["coi_note","factor1_comment","factor2_comment","factor3_explanation","human_subjects_comment","summary","strengths","weaknesses"];
// token: URL hash (#t=TOKEN, preferred: never sent to servers) or ?t= (compatibility)
let TOKEN = hashParams().get("t") || params.get("t") || "";
// strip ?t= from the address bar right away (keeps the token out of history/bookmarks of the query string)
if (params.has("t") && TOKEN) history.replaceState(null, "", location.pathname + "#t=" + encodeURIComponent(TOKEN));
const appHash = (id, stage) => "#t=" + encodeURIComponent(TOKEN) + "&a=" + encodeURIComponent(id) + "&s=" + stage;

async function realMe(t){
  const r = await fetch(API_URL + (API_URL.includes("?")?"&":"?") + "action=me&t=" + encodeURIComponent(t));
  return r.json();
}
async function realSave(body){
  const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body)});
  return r.json();
}

/* mock: same contract, state in localStorage */
const MKEY = "aitc-demo-reviews-v1";
const mockStore = () => { try { return JSON.parse(localStorage.getItem(MKEY) || "{}"); } catch(e) { return {}; } };
async function mockMe(t){
  const rv = MOCK.reviewers.find(x => x.token === t);
  if (!rv) return {error:"invalid_token"};
  const asg = MOCK.assignments.filter(a => a.token === t).map(a => ({application_id:a.application_id, stage:a.stage}));
  const apps = asg.map(a => { const x = MOCK.applications.find(p => p.application_id===a.application_id && p.stage===a.stage); return {application_id:a.application_id, stage:a.stage, data:x.json}; });
  const st = mockStore();
  const reviews = asg.map(a => st[t+"|"+a.application_id+"|"+a.stage] ? Object.assign({application_id:a.application_id, stage:a.stage}, st[t+"|"+a.application_id+"|"+a.stage]) : null).filter(Boolean);
  return {reviewer:{name:rv.name}, assignments:asg, applications:apps, reviews};
}
async function mockSave(b){
  const rv = MOCK.reviewers.find(x => x.token === b.t);
  if (!rv) return {error:"invalid_token"};
  if (!MOCK.assignments.some(a => a.token===b.t && a.application_id===b.application_id && a.stage===b.stage)) return {error:"not_assigned"};
  const st = mockStore(), k = b.t+"|"+b.application_id+"|"+b.stage;
  if (st[k] && (st[k].status==="submitted"||st[k].status==="conflict")) return {error:"locked", status:st[k].status};
  const status = !b.submit ? "draft" : (b.review.coi_declared==="conflict" ? "conflict" : "submitted");
  const now = new Date().toISOString();
  st[k] = {status, updated_at:now, review:b.review};
  localStorage.setItem(MKEY, JSON.stringify(st));
  return {ok:true, status, updated_at:now};
}
async function realInvite(t, id, stage){
  const r = await fetch(API_URL + (API_URL.includes("?")?"&":"?") + "action=invite&t=" + encodeURIComponent(t) + "&app=" + encodeURIComponent(id) + "&stage=" + stage);
  return r.json();
}
const GS_DEMO = true;     // true only in review_synth_demo.html (runs the real Code.gs on an in-memory Sheet)

/* In-memory stand-ins for the Apps Script services used by Admin.gs. Shared by the Node tests and admin_demo.html. */
function makeFakeGas(opts) {
  opts = opts || {};
  var tabs = opts.tabs || {};           // name -> array of rows
  var sheetsObj = {};
  var props = opts.props || {};
  var state = { openByIdCalls: 0, writes: 0, locks: 0, mails: [] };
  function onChange() { state.writes++; if (opts.onChange) opts.onChange(tabs); }
  function mkSheet(name) {
    if (!tabs[name]) tabs[name] = [];
    var sh = { name: name, fmt: {} };
    Object.defineProperty(sh, 'rows', { get: function () { return tabs[name]; } });
    sh.getDataRange = function () { return { getValues: function () { return tabs[name].map(function (r) { return r.slice(); }); } }; };
    sh.getLastRow = function () { return tabs[name].length; };
    sh.setFrozenRows = function () {};
    sh.getRange = function (r, c, nr, nc) {
      nr = nr || 1; nc = nc || 1;
      var rng = {
        setValues: function (v) {
          for (var i = 0; i < v.length; i++) {
            var row = tabs[name][r - 1 + i] || [];
            for (var j = 0; j < v[i].length; j++) row[c - 1 + j] = v[i][j];
            for (var q = 0; q < row.length; q++) if (row[q] === undefined) row[q] = '';
            tabs[name][r - 1 + i] = row;
          }
          onChange(); return rng;
        },
        setValue: function (v) { return rng.setValues([[v]]); },
        setNumberFormat: function (f) { for (var i = 0; i < nr; i++) for (var j = 0; j < nc; j++) sh.fmt[(r + i) + ',' + (c + j)] = f; return rng; },
        setNumberFormats: function (a) { for (var i = 0; i < a.length; i++) for (var j = 0; j < a[i].length; j++) sh.fmt[(r + i) + ',' + (c + j)] = a[i][j]; return rng; }
      };
      return rng;
    };
    return sh;
  }
  var ss = {
    getName: function () { return 'fake'; },
    getOwner: function () { return opts.owner === null ? null : { getEmail: function () { return opts.owner || 'owner@x.org'; } }; },
    getEditors: function () { if (opts.editorsThrow) throw new Error('x'); return (opts.editors || ['admin@x.org']).map(function (e) { return { getEmail: function () { return e; } }; }); },
    getSheetByName: function (n) { if (!tabs.hasOwnProperty(n)) return null; return sheetsObj[n] || (sheetsObj[n] = mkSheet(n)); },
    insertSheet: function (n) { tabs[n] = tabs[n] || []; sheetsObj[n] = mkSheet(n); onChange(); return sheetsObj[n]; }
  };

const SYNTH_KEY = "aitc_synth_sheet_v1", SYNTH_MAIL = "aitc_synth_mail_v1";
function fixDates(v){
  const now = new Date();
  const wal = (s) => { const m = /^@([Dd])([+-]\d+)$/.exec(s); if (!m) return s; const d = new Date(now.getTime() + Number(m[2]) * 86400000); return m[1] === "d" ? d.toISOString().slice(0, 10) : d.toISOString(); };
  return v.map(t => t.map(r => r.map(c => typeof c === "string" ? wal(c) : c)));
}
function synthTabs(){
  let t = null;
  try { t = JSON.parse(localStorage.getItem(SYNTH_KEY)); } catch (e) {}
  if (!t) { t = {}; for (const k in SYNTH_SEED) t[k] = fixDates([SYNTH_SEED[k]])[0]; }
  return t;
}
function synthMails(){ try { return JSON.parse(localStorage.getItem(SYNTH_MAIL)) || []; } catch (e) { return []; } }
function synthFake(email, props){
  const fg = makeFakeGas({ tabs: synthTabs(), sheetId: "DEMO", email: email, editors: [email], owner: email, quota: 100, props: props,
    onChange: t => { try { localStorage.setItem(SYNTH_KEY, JSON.stringify(t)); } catch (e) {} } });
  const send = fg.globals.MailApp.sendEmail;
  fg.globals.MailApp.sendEmail = function (o) {
    const stored = synthMails(); stored.push(Object.assign({ at: new Date().toISOString() }, o));
    if (stored.length > 100) throw new Error("quota");
    fg.state.mails.length = 0; stored.forEach(m => fg.state.mails.push(m));
    localStorage.setItem(SYNTH_MAIL, JSON.stringify(stored));

}
function synthMailbox(bar){

  const d = document.createElement("dialog"); d.id = "mailDlg"; d.style.maxWidth = "720px"; d.style.width = "92vw"; document.body.appendChild(d);
  const esc2 = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const lk = s => esc2(s).replace(/((?:https?:\/\/|file:\/\/\/|review_synth_demo\.html)[^\s<]*)/g, u => '<a href="' + u.replace(/&amp;/g, "&") + '">' + u + "</a>");

}

const REVIEWER_GS = "/**\n * aitcreview reviewer portal backend (Google Apps Script web app).\n * Tabs: Reviewers, Assignments, Applications, Reviews. Run setup() once.\n * Deploy: Web app, Execute as Me, Who has access: Anyone.\n */\nvar TABS = {\n  Reviewers: ['token', 'name', 'email', 'active', 'institution'],\n  Assignments: ['token', 'application_id', 'stage', 'status', 'assigned_at', 'assigned_by', 'invited_at',\n    'responded_at', 'decline_reason', 'due_date', 'last_contacted_at', 'contact_count', 'suggested_reviewer'],\n  Applications: ['application_id', 'stage', 'json'],\n  Reviews: ['updated_at', 'reviewer_name', 'reviewer_email', 'application_id', 'stage', 'status',\n    'coi_declared', 'coi_note', 'factor1_score', 'factor1_comment', 'factor2_score',\n    'factor2_comment', 'factor3', 'factor3_explanation', 'human_subjects',\n    'human_subjects_comment', 'overall_impact', 'summary', 'strengths', 'weaknesses']\n};\n// Append-only durability log: every successful save/submit appends a full copy here BEFORE Reviews is upserted. Code never edits or deletes it.\nTABS.Submissions = ['logged_at'].concat(TABS.Reviews);\n// Invitation flow (step 2): admin sets assigned -> invited; the reviewer answers on the invitation page: invited -> accepted | declined.\n// Assignment status gating: blank (legacy rows), assigned and accepted grant access. invited, declined,\n// removed and anything unrecognised do NOT.\nvar ASSIGN_ALLOWED = { '': true, assigned: true, accepted: true };\nvar EDITABLE = { '': true, draft: true }; // any other status (submitted, conflict, typos) is locked\nvar MAX_TEXT = 5000;      // per text field\nvar MAX_TOTAL = 30000;    // all text fields together (Sheets cell limit is 50000)\nvar TEXT_FIELDS = ['coi_note', 'factor1_comment', 'factor2_comment', 'factor3_explanation',\n  'human_subjects_comment', 'summary', 'strengths', 'weaknesses'];\nvar SCORE_FIELDS = ['factor1_score', 'factor2_score', 'overall_impact'];\n\nfunction setup() {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  for (var name in TABS) {\n    if (!TABS.hasOwnProperty(name)) continue;\n    var sh = ss.getSheetByName(name) || ss.insertSheet(name);\n    var h = TABS[name];\n    sh.getRange(1, 1, 1, h.length).setValues([h]);\n    sh.setFrozenRows(1);\n  }\n  var def = ss.getSheetByName('Sheet1');\n  if (def && ss.getSheets().length > 1 && def.getLastRow() === 0) ss.deleteSheet(def);\n  checkReviewers();\n}\n\nfunction normEmail_(v) {\n  return String(v === null || v === undefined ? '' : v).replace(/^\\s+|\\s+$/g, '').toLowerCase();\n}\nfunction normStatus_(v) {\n  return String(v === null || v === undefined ? '' : v).replace(/^\\s+|\\s+$/g, '').toLowerCase();\n}\n\n/** Returns a list of problems in the Reviewers tab: empty or duplicate (case/space-insensitive) emails. */\nfunction reviewerProblems_() {\n  var rows = readTab_('Reviewers'), seen = {}, probs = [], i;\n  for (i = 0; i < rows.length; i++) {\n    if (!isActive_(rows[i].active)) continue; // deactivated rows (e.g. after a token rotation) are ignored\n    var e = normEmail_(rows[i].email);\n    if (!e) { probs.push('Row ' + rows[i]._row + ' (' + rows[i].name + '): email is empty'); continue; }\n    (seen[e] = seen[e] || []).push(rows[i]._row);\n  }\n  for (var k in seen) if (seen.hasOwnProperty(k) && seen[k].length > 1) {\n    probs.push('Duplicate email \"' + k + '\" in rows ' + seen[k].join(', '));\n  }\n  return probs;\n}\n\n/** Admin: run from the editor (or the aitcreview menu) to list reviewer rows that would be rejected. */\nfunction checkReviewers() {\n  var probs = reviewerProblems_();\n  var msg = probs.length ? 'Fix these before sending links:\\n' + probs.join('\\n') : 'Reviewers tab OK: every email is present and unique.';\n  try { Logger.log(msg); } catch (e1) {}\n  try { SpreadsheetApp.getUi().alert(msg); } catch (e2) {}\n  return probs;\n}\n\nfunction onOpen() {\n  try {\n    SpreadsheetApp.getUi().createMenu('aitcreview')\n      .addItem('Check reviewers', 'checkReviewers')\n      .addItem('Export reviews (safe CSV tab)', 'exportReviewsCsvSafe')\n      .addItem('Restore a review from the Submissions log', 'restoreReviewFromLog').addToUi();\n  } catch (e) {}\n}\n\n/** Admin: writes a formula-safe copy of Reviews to the ReviewsExport tab. Download THAT tab as CSV. */\nfunction exportReviewsCsvSafe() {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var src = ss.getSheetByName('Reviews');\n  var vals = src ? src.getDataRange().getValues() : [];\n  var rows = [], r, c;\n  for (r = 0; r < vals.length; r++) {\n    var row = [];\n    for (c = 0; c < vals[r].length; c++) {\n      var v = vals[r][c];\n      row.push(typeof v === 'string' ? safeCell_(unsafeCell_(v)) : v);\n    }\n    rows.push(row);\n  }\n  var dst = ss.getSheetByName('ReviewsExport') || ss.insertSheet('ReviewsExport');\n  dst.clear();\n  if (rows.length) {\n    dst.getRange(1, 1, rows.length, rows[0].length).setNumberFormat('@');\n    dst.getRange(1, 1, rows.length, rows[0].length).setValues(rows);\n  }\n  return rows;\n}\n\nfunction out_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction readTab_(name) {\n  var sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name);\n  if (!sh) return [];\n  var vals = sh.getDataRange().getValues();\n  var head = vals[0] || [];\n  var rows = [];\n  for (var i = 1; i < vals.length; i++) {\n    var o = { _row: i + 1 };\n    for (var j = 0; j < head.length; j++) o[head[j]] = vals[i][j];\n    rows.push(o);\n  }\n  return rows;\n}\n\nfunction isActive_(v) {\n  return v === true || String(v).toUpperCase() === 'TRUE';\n}\n\n/** Returns {rv} or {error}. Email is required, and must be unique (case/space-insensitive). */\nfunction resolveReviewer_(token) {\n  token = String(token || '');\n  if (!token) return { error: 'invalid_token' };\n  var rows = readTab_('Reviewers'), found = null, i;\n  for (i = 0; i < rows.length; i++) {\n    if (String(rows[i].token) === token) { found = rows[i]; break; }\n  }\n  if (!found || !isActive_(found.active)) return { error: 'invalid_token' };\n  var e = normEmail_(found.email);\n  if (!e) return { error: 'reviewer_email_missing', message: 'Your reviewer record has no email. Ask the AITC coordinator to fix it.' };\n  for (i = 0; i < rows.length; i++) {\n    if (rows[i] !== found && isActive_(rows[i].active) && normEmail_(rows[i].email) === e) {\n      return { error: 'duplicate_email', message: 'Your email appears more than once in the reviewer list. Ask the AITC coordinator to fix it.' };\n    }\n  }\n  return { rv: found };\n}\n\nfunction myAssignments_(token) {\n  var rows = readTab_('Assignments'), res = [];\n  for (var i = 0; i < rows.length; i++) {\n    if (String(rows[i].token) === token && ASSIGN_ALLOWED[normStatus_(rows[i].status)] === true) {\n      res.push({ application_id: String(rows[i].application_id), stage: String(rows[i].stage) });\n    }\n  }\n  return res;\n}\n\nfunction doGet(e) {\n  try {\n    var p = (e && e.parameter) || {};\n    if (p.action === 'snapshot') return snapshotOut_(p);\n    if (p.action === 'invite') return out_(inviteInfo_(p));\n    if (p.action !== 'me') return out_({ error: 'unknown action' });\n    var res0 = resolveReviewer_(p.t);\n    if (res0.error) return out_(res0);\n    var rv = res0.rv;\n    var token = String(rv.token);\n    var asg = myAssignments_(token);\n    var allow = {};\n    for (var i = 0; i < asg.length; i++) allow[asg[i].application_id + '|' + asg[i].stage] = true;\n    var apps = [], arows = readTab_('Applications');\n    for (var a = 0; a < arows.length; a++) {\n      var k = String(arows[a].application_id) + '|' + String(arows[a].stage);\n      if (allow[k]) {\n        var data = {};\n        try { data = JSON.parse(arows[a].json); } catch (err) { data = {}; }\n        apps.push({ application_id: String(arows[a].application_id), stage: String(arows[a].stage), data: data });\n      }\n    }\n    var revs = [], rrows = readTab_('Reviews'), key = reviewerKey_(rv);\n    for (var r = 0; r < rrows.length; r++) {\n      if (rowKey_(rrows[r]) !== key) continue;\n      if (!allow[String(rrows[r].application_id) + '|' + String(rrows[r].stage)]) continue;\n      revs.push({\n        application_id: String(rrows[r].application_id), stage: String(rrows[r].stage),\n        status: normStatus_(rrows[r].status) || 'draft', updated_at: String(rrows[r].updated_at),\n        review: rowToReview_(rrows[r])\n      });\n    }\n    return out_({ reviewer: { name: String(rv.name) }, assignments: asg, applications: apps, reviews: revs, invitations: pendingInvites_(token) });\n  } catch (ex) {\n    return out_({ error: 'server_error' });\n  }\n}\n\n/** Stable reviewer identity: email (survives token rotation). */\nfunction reviewerKey_(rv) {\n  return 'e:' + normEmail_(rv.email);\n}\nfunction rowKey_(row) {\n  var e = normEmail_(row.reviewer_email);\n  return e ? 'e:' + e : 'none:' + String(row._row); // rows without email never match anyone\n}\n\n/** Formula-injection guard: cells starting with = + - @ tab CR get a leading single quote. */\nfunction safeCell_(v) {\n  if (typeof v !== 'string') return v;\n  return /^[=+\\-@\\t\\r]/.test(v) ? \"'\" + v : v;\n}\nfunction unsafeCell_(v) {\n  if (typeof v !== 'string') return v;\n  return /^'[=+\\-@\\t\\r]/.test(v) ? v.substring(1) : v;\n}\n\nfunction rowToReview_(row) {\n  var rv = { coi_declared: unsafeCell_(String(row.coi_declared || '')), factor3: String(row.factor3 || ''),\n    human_subjects: String(row.human_subjects || '') };\n  var i;\n  for (i = 0; i < TEXT_FIELDS.length; i++) rv[TEXT_FIELDS[i]] = unsafeCell_(String(row[TEXT_FIELDS[i]] === undefined ? '' : row[TEXT_FIELDS[i]]));\n  for (i = 0; i < SCORE_FIELDS.length; i++) {\n    var v = row[SCORE_FIELDS[i]];\n    rv[SCORE_FIELDS[i]] = (v === '' || v === null || v === undefined) ? '' : Number(v);\n  }\n  return rv;\n}\n\nfunction isInt19_(v) {\n  if (typeof v === 'string' && /^[1-9]$/.test(v)) v = Number(v);\n  return typeof v === 'number' && v === Math.floor(v) && v >= 1 && v <= 9;\n}\n\nfunction str_(v) {\n  v = (v === null || v === undefined) ? '' : String(v);\n  return v;\n}\n\n/** Returns {errors:[...], clean:{...}}. Drafts only check what is present; submit checks completeness. */\nfunction validateReview_(rv, submit) {\n  var errs = [], c = {};\n  rv = rv || {};\n  c.coi_declared = rv.coi_declared === 'conflict' ? 'conflict' : (rv.coi_declared === 'none' ? 'none' : '');\n  c.coi_note = str_(rv.coi_note);\n  var fields = ['factor1_comment', 'factor2_comment', 'factor3_explanation', 'human_subjects_comment',\n    'summary', 'strengths', 'weaknesses'];\n  for (var f = 0; f < fields.length; f++) c[fields[f]] = str_(rv[fields[f]]);\n  var total = 0;\n  for (var tf = 0; tf < TEXT_FIELDS.length; tf++) {\n    var len = c[TEXT_FIELDS[tf]].length;\n    total += len;\n    if (len > MAX_TEXT) errs.push(TEXT_FIELDS[tf] + ' is too long (' + len + ' characters; the limit is ' + MAX_TEXT + ')');\n  }\n  if (total > MAX_TOTAL) errs.push('Your review is too long in total (' + total + ' characters; the limit is ' + MAX_TOTAL + '). Please shorten it.');\n  var scores = ['factor1_score', 'factor2_score', 'overall_impact'];\n  for (var s = 0; s < scores.length; s++) {\n    var v = rv[scores[s]];\n    if (v === '' || v === null || v === undefined) { c[scores[s]] = ''; continue; }\n    if (!isInt19_(v)) errs.push(scores[s] + ' must be an integer from 1 to 9');\n    else c[scores[s]] = Number(v);\n  }\n  c.factor3 = rv.factor3 === undefined || rv.factor3 === null ? '' : String(rv.factor3);\n  if (c.factor3 !== '' && c.factor3 !== 'appropriate' && c.factor3 !== 'gaps') errs.push('factor3 invalid');\n  c.human_subjects = rv.human_subjects === undefined || rv.human_subjects === null ? '' : String(rv.human_subjects);\n  if (c.human_subjects !== '' && c.human_subjects !== 'acceptable' &&\n      c.human_subjects !== 'unacceptable' && c.human_subjects !== 'na') errs.push('human_subjects invalid');\n  if (rv.coi_declared !== undefined && rv.coi_declared !== '' && c.coi_declared === '') errs.push('coi_declared invalid');\n\n  if (c.coi_declared === 'conflict') {\n    // a conflicted reviewer must not leave scores or comments behind\n    for (var b = 0; b < SCORE_FIELDS.length; b++) c[SCORE_FIELDS[b]] = '';\n    for (var bt = 0; bt < TEXT_FIELDS.length; bt++) if (TEXT_FIELDS[bt] !== 'coi_note') c[TEXT_FIELDS[bt]] = '';\n    c.factor3 = ''; c.human_subjects = '';\n  }\n  if (submit && !errs.length) {\n    if (!c.coi_declared) errs.push('Declare whether you have a conflict of interest');\n    else if (c.coi_declared === 'conflict') {\n      if (!c.coi_note.replace(/\\s/g, '')) errs.push('Describe the conflict in the note');\n    } else {\n      if (c.factor1_score === '') errs.push('factor1_score required');\n      if (c.factor2_score === '') errs.push('factor2_score required');\n      if (!c.factor3) errs.push('factor3 required');\n      if (c.factor3 === 'gaps' && !c.factor3_explanation.replace(/\\s/g, '')) errs.push('factor3_explanation required when gaps identified');\n      if (!c.human_subjects) errs.push('human_subjects required');\n      if (c.human_subjects === 'unacceptable' && !c.human_subjects_comment.replace(/\\s/g, '')) errs.push('human_subjects_comment required when unacceptable');\n      if (c.overall_impact === '') errs.push('overall_impact required');\n      if (!c.summary.replace(/\\s/g, '')) errs.push('summary required');\n    }\n  }\n  return { errors: errs, clean: c };\n}\n\nfunction doPost(e) {\n  var lock = LockService.getScriptLock();\n  try {\n    var body;\n    try { body = JSON.parse((e && e.postData && e.postData.contents) || ''); } catch (pe) { return out_({ error: 'bad_request' }); }\n    if (!body || typeof body !== 'object') return out_({ error: 'bad_request' });\n    var res0 = resolveReviewer_(body.t);\n    if (res0.error) return out_(res0);\n    var rv = res0.rv;\n    var token = String(rv.token);\n    if (body.action === 'respond') return out_(respond_(rv, body));\n    var appId = String(body.application_id || ''), stage = String(body.stage || '');\n    if (stage !== 'loi' && stage !== 'full') return out_({ error: 'bad_stage' });\n    var asg = myAssignments_(token), ok = false;\n    for (var i = 0; i < asg.length; i++) {\n      if (asg[i].application_id === appId && asg[i].stage === stage) ok = true;\n    }\n    if (!ok) return out_({ error: 'not_assigned' });\n    var submit = body.submit === true;\n    var v = validateReview_(body.review, submit);\n    if (v.errors.length) return out_({ error: 'validation', details: v.errors });\n    var c = v.clean;\n\n    lock.waitLock(20000);\n    var sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Reviews');\n    var rows = readTab_('Reviews'), existing = null, key = reviewerKey_(rv);\n    for (var r = 0; r < rows.length; r++) {\n      if (rowKey_(rows[r]) === key && String(rows[r].application_id) === appId && String(rows[r].stage) === stage) {\n        existing = rows[r]; break;\n      }\n    }\n    if (existing && !EDITABLE[normStatus_(existing.status)]) {\n      return out_({ error: 'locked', status: normStatus_(existing.status) });\n    }\n    var status = 'draft';\n    if (submit) status = c.coi_declared === 'conflict' ? 'conflict' : 'submitted';\n    var now = new Date().toISOString();\n    var head = TABS.Reviews, row = [];\n    var vals = {\n      updated_at: now, reviewer_name: String(rv.name), reviewer_email: String(rv.email).replace(/^\\s+|\\s+$/g, ''),\n      application_id: appId, stage: stage, status: status\n    };\n    for (var k in c) if (c.hasOwnProperty(k)) vals[k] = c[k];\n    for (var h = 0; h < head.length; h++) row.push(vals[head[h]] === undefined ? '' : safeCell_(vals[head[h]]));\n    logSubmission_(now, row); // durable copy FIRST; if this throws, nothing is written to Reviews and the client keeps the draft\n    var target = existing ? existing._row : sh.getLastRow() + 1;\n    var rng = sh.getRange(target, 1, 1, head.length);\n    // text columns stay text (no formula injection); score columns are real numbers\n    var fmts = [];\n    for (var cI = 0; cI < head.length; cI++) fmts.push(SCORE_FIELDS.indexOf(head[cI]) >= 0 ? '0' : '@');\n    rng.setNumberFormats([fmts]);\n    rng.setValues([row]);\n    var receipt = submit ? sendReceipts_(rv, appId, stage, status, vals) : null;\n    return out_({ ok: true, status: status, updated_at: now, receipt_sent: receipt ? receipt.reviewer : false });\n  } catch (ex) {\n    return out_({ error: 'server_error' });\n  } finally {\n    try { lock.releaseLock(); } catch (e2) {}\n  }\n}\n\n\n/* ================= step 2: invitation page (read) and response (write) ================= */\n\nfunction prop_(k, d) {\n  var v = null;\n  try { v = PropertiesService.getScriptProperties().getProperty(k); } catch (e) { v = null; }\n  v = (v === null || v === undefined) ? '' : String(v).replace(/^\\s+|\\s+$/g, '');\n  return v === '' ? d : v;\n}\nfunction requireCoi_() { return prop_('REQUIRE_COI_ON_ACCEPT', 'true').toLowerCase() !== 'false'; }\nvar RESPOND_STATES = { invited: true, accepted: true, declined: true };\n\nfunction toDay_(v) {\n  if (Object.prototype.toString.call(v) === '[object Date]') return v.toISOString().substring(0, 10);\n  var m = /^(\\d{4}-\\d{2}-\\d{2})/.exec(String(v === null || v === undefined ? '' : v).replace(/^\\s+/, ''));\n  return m ? m[1] : '';\n}\n\n/** The assignment row of this reviewer for app+stage that is in the invitation flow (last one wins); null otherwise. */\nfunction findInviteRow_(token, appId, stage) {\n  var rows = readTab_('Assignments'), found = null;\n  for (var i = 0; i < rows.length; i++) {\n    if (String(rows[i].token) === token && String(rows[i].application_id) === appId && String(rows[i].stage) === stage &&\n        RESPOND_STATES[normStatus_(rows[i].status)] === true) found = rows[i];\n  }\n  return found;\n}\n\n/** Short abstract from the application JSON: explicit abstract field, else the first answer that looks like a summary/aims. */\nfunction abstractOf_(d) {\n  var t = '';\n  if (d && typeof d.abstract === 'string') t = d.abstract;\n  else if (d && d.answers && d.answers.length) {\n    for (var i = 0; i < d.answers.length; i++) {\n      if (/abstract|aims?\\b|summary|description|overview/i.test(String(d.answers[i].q)) && String(d.answers[i].a || '').replace(/\\s/g, '')) { t = String(d.answers[i].a); break; }\n    }\n  }\n  t = t.replace(/^\\s+|\\s+$/g, '');\n  return t.length > 1200 ? t.substring(0, 1200) + '...' : t;\n}\nfunction appData_(appId, stage) {\n  var rows = readTab_('Applications');\n  for (var i = 0; i < rows.length; i++) {\n    if (String(rows[i].application_id) === appId && String(rows[i].stage) === stage) {\n      try { var d = JSON.parse(rows[i].json); return d && typeof d === 'object' ? d : {}; } catch (e) { return {}; }\n    }\n  }\n  return null;\n}\n\n/** doGet action=invite: ONLY title, abstract, due date and the current state. Never the application body. */\nfunction inviteInfo_(p) {\n  var res0 = resolveReviewer_(p.t);\n  if (res0.error) return res0;\n  var rv = res0.rv, token = String(rv.token), appId = String(p.app || ''), stage = String(p.stage || '');\n  if (stage !== 'loi' && stage !== 'full') return { error: 'not_invited' };\n  var row = findInviteRow_(token, appId, stage);\n  if (!row) return { error: 'not_invited' };\n  var d = appData_(appId, stage);\n  if (d === null) return { error: 'not_invited' };\n  var st = normStatus_(row.status);\n  return { ok: true, reviewer: { name: String(rv.name) }, application_id: appId, stage: stage, status: st,\n    title: String(d.title || ''), abstract: abstractOf_(d), due_date: toDay_(row.due_date),\n    require_coi: requireCoi_(), decline_reason: st === 'declined' ? unsafeCell_(String(row.decline_reason || '')) : '' };\n}\n\nfunction pendingInvites_(token) {\n  var rows = readTab_('Assignments'), out = [], seen = {};\n  for (var i = 0; i < rows.length; i++) {\n    if (String(rows[i].token) !== token || normStatus_(rows[i].status) !== 'invited') continue;\n    var k = rows[i].application_id + '|' + rows[i].stage;\n    if (seen[k]) continue;\n    seen[k] = true;\n    var d = appData_(String(rows[i].application_id), String(rows[i].stage)) || {};\n    out.push({ application_id: String(rows[i].application_id), stage: String(rows[i].stage), title: String(d.title || '') });\n  }\n  return out;\n}\n\nfunction ensureAsgCols_(sh) {\n  var vals = sh.getDataRange().getValues(), head = (vals[0] || []).slice(), changed = false;\n  for (var i = 0; i < TABS.Assignments.length; i++) if (head.indexOf(TABS.Assignments[i]) < 0) { head.push(TABS.Assignments[i]); changed = true; }\n  if (changed) sh.getRange(1, 1, 1, head.length).setValues([head]);\n  return head;\n}\nfunction setAsg_(sh, head, rowNum, col, value) {\n  var c = head.indexOf(col) + 1;\n  if (c < 1) return;\n  var rng = sh.getRange(rowNum, c, 1, 1);\n  rng.setNumberFormat('@');\n  rng.setValue(safeCell_(value));\n}\nfunction clean_(v, max) {\n  return String(v === null || v === undefined ? '' : v).replace(/[\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f]/g, '').replace(/^\\s+|\\s+$/g, '').substring(0, max);\n}\nfunction esc_(v) {\n  return String(v === null || v === undefined ? '' : v).replace(/[&<>\"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]; });\n}\n\nfunction appendAudit_(actor, action, appId, stage, detail) {\n  try {\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    var sh = ss.getSheetByName('AuditLog') || ss.insertSheet('AuditLog');\n    var head = ['at', 'actor', 'action', 'application_id', 'stage', 'detail'];\n    if (!sh.getDataRange().getValues().length) sh.getRange(1, 1, 1, head.length).setValues([head]);\n    var r = sh.getLastRow() + 1, rng = sh.getRange(r, 1, 1, head.length);\n    rng.setNumberFormats([['@', '@', '@', '@', '@', '@']]);\n    rng.setValues([[new Date().toISOString(), safeCell_(actor), action, safeCell_(appId), stage, safeCell_(detail)]]);\n  } catch (e) {}\n}\n\n/** Confirmation email after Accept: personal review link. Plain text + escaped HTML. Returns true if sent. */\nfunction sendAcceptEmail_(rv, title, token, appId, stage) {\n  var to = normEmail_(rv.email);\n  if (!to) return false;\n  var base = prop_('REVIEW_BASE_URL', '').replace(/[#?].*$/, '');\n  var link = base ? base + '#t=' + encodeURIComponent(token) + '&a=' + encodeURIComponent(appId) + '&s=' + stage : '';\n  var name = String(rv.name), subj = ('Review accepted: ' + title).replace(/[\\r\\n]+/g, ' ').substring(0, 150);\n  var body = 'Hello ' + name + ',\\n\\nThank you for accepting the review of \"' + title + '\" (' + (stage === 'loi' ? 'LOI' : 'full application') + ').\\n\\n' +\n    (link ? 'Your personal review link (do not share it):\\n' + link + '\\n' : 'Please use your original personal review link.\\n') + '\\nThe AITC review team';\n  var html = '<p>Hello ' + esc_(name) + ',<\/p><p>Thank you for accepting the review of <b>' + esc_(title) + '<\/b> (' + (stage === 'loi' ? 'LOI' : 'full application') + ').<\/p>' +\n    (link ? '<p>Your personal review link (do not share it):<br><a href=\"' + esc_(link) + '\">' + esc_(link) + '<\/a><\/p>' : '<p>Please use your original personal review link.<\/p>') + '<p>The AITC review team<\/p>';\n  var opts = { to: to, subject: subj, body: body, htmlBody: html, name: prop_('SENDER_NAME', 'AITC Review') };\n  var rt = prop_('REPLY_TO', '');\n  if (rt) opts.replyTo = rt;\n  try { MailApp.sendEmail(opts); return true; } catch (e) { return false; }\n}\n\n/** doPost action=respond. Only an invited row can change; repeating the same answer is a no-op (idempotent). */\nfunction respond_(rv, b) {\n  var token = String(rv.token), appId = String(b.application_id || ''), stage = String(b.stage || '');\n  if (stage !== 'loi' && stage !== 'full') return { error: 'not_invited' };\n  var decision = b.decision === 'accept' ? 'accept' : (b.decision === 'decline' ? 'decline' : '');\n  if (!decision) return { error: 'validation', details: ['decision must be accept or decline'] };\n  var coi = b.coi === 'conflict' ? 'conflict' : (b.coi === 'none' ? 'none' : '');\n  var reason = clean_(b.reason, 500), suggested = clean_(b.suggested, 200);\n  if (decision === 'accept' && requireCoi_() && !coi) {\n    return { error: 'coi_required', message: 'Please confirm that you have no conflict of interest, or declare a conflict.' };\n  }\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    var row = findInviteRow_(token, appId, stage);\n    if (!row) return { error: 'not_invited' };\n    var cur = normStatus_(row.status);\n    var wantDecline = decision === 'decline' || coi === 'conflict';\n    if (cur === 'accepted') return wantDecline ? { error: 'already_responded', status: 'accepted' } : { ok: true, status: 'accepted', already: true };\n    if (cur === 'declined') return wantDecline ? { ok: true, status: 'declined', already: true } : { error: 'already_responded', status: 'declined' };\n    var sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Assignments'), head = ensureAsgCols_(sh), now = new Date().toISOString();\n    var d = appData_(appId, stage) || {}, title = String(d.title || '');\n    if (wantDecline) {\n      var why = coi === 'conflict' ? ('conflict' + (reason ? ': ' + reason : '')) : reason;\n      setAsg_(sh, head, row._row, 'status', 'declined');\n      setAsg_(sh, head, row._row, 'responded_at', now);\n      setAsg_(sh, head, row._row, 'decline_reason', why);\n      setAsg_(sh, head, row._row, 'suggested_reviewer', suggested);\n      appendAudit_(rv.email, 'respond_decline', appId, stage, 'reason=' + why + (suggested ? '; suggested=' + suggested : ''));\n      notifyDecline_(rv, title, appId, stage, why, suggested);\n      return { ok: true, status: 'declined' };\n    }\n    setAsg_(sh, head, row._row, 'status', 'accepted');\n    setAsg_(sh, head, row._row, 'responded_at', now);\n    appendAudit_(rv.email, 'respond_accept', appId, stage, requireCoi_() ? 'coi=none' : 'coi not required');\n    var sent = sendAcceptEmail_(rv, title, token, appId, stage);\n    appendAudit_(rv.email, 'confirmation_email', appId, stage, sent ? 'sent' : 'not sent');\n    return { ok: true, status: 'accepted', mail_sent: sent };\n  } finally {\n    try { lock.releaseLock(); } catch (e) {}\n  }\n}\n\n\n/* ================= round 5: durability (never lose a submitted review) ================= */\n\nfunction ensureSubmissions_(ss) {\n  var sh = ss.getSheetByName('Submissions') || ss.insertSheet('Submissions');\n  if (!sh.getDataRange().getValues().length) {\n    sh.getRange(1, 1, 1, TABS.Submissions.length).setValues([TABS.Submissions]);\n    try { sh.setFrozenRows(1); } catch (e) {}\n  }\n  return sh;\n}\n\n/** Appends one full row to the Submissions log. APPEND ONLY: this is the only code that writes to that tab. */\nfunction logSubmission_(loggedAt, reviewRow) {\n  var sh = ensureSubmissions_(SpreadsheetApp.getActiveSpreadsheet()), head = TABS.Submissions, r = sh.getLastRow() + 1;\n  var rng = sh.getRange(r, 1, 1, head.length), fmts = [];\n  for (var i = 0; i < head.length; i++) fmts.push(SCORE_FIELDS.indexOf(head[i]) >= 0 ? '0' : '@');\n  rng.setNumberFormats([fmts]);\n  rng.setValues([[loggedAt].concat(reviewRow)]);\n}\n\n/** Admin: rebuild (insert or overwrite) the Reviews row of reviewer+application+stage from the LATEST Submissions log entry. */\nfunction restoreFromLog_(email, appId, stage) {\n  email = normEmail_(email); appId = String(appId || ''); stage = String(stage || '');\n  var ss = SpreadsheetApp.getActiveSpreadsheet(), log = readTab_('Submissions'), last = null, i;\n  for (i = 0; i < log.length; i++) {\n    if (normEmail_(log[i].reviewer_email) === email && String(log[i].application_id) === appId && String(log[i].stage) === stage) last = log[i];\n  }\n  if (!last) return { error: 'no_log_entry' };\n  var head = TABS.Reviews, row = [];\n  for (i = 0; i < head  REVIEW_LABELS = [['coi_declared', 'Conflict of interest'], ['coi_note', 'Conflict note'], ['factor1_score', 'Factor 1 score (1 = best)'], ['factor1_comment', 'Factor 1 comment'],\n  ['factor2_score', 'Factor 2 score (1 = best)'], ['factor2_comment', 'Factor 2 comment'], ['factor3', 'Factor 3 (expertise and resources)'], ['factor3_explanation', 'Factor 3 explanation'],\n  ['human_subjects', 'Human subjects protections'], ['human_subjects_comment', 'Human subjects comment'], ['overall_impact', 'Overall impact (1 = best)'],\n  ['summary', 'Summary'], ['strengths', 'Strengths'], ['weaknesses', 'Weaknesses']];\n\nfunction reviewText_(vals, title, stage) {\n  var t = 'Review ' + (vals.status === 'conflict' ? 'conflict declaration ' : '') + 'received\\n\\nApplication: ' + title + ' (' + (stage === 'loi' ? 'LOI' : 'full application') + ')\\nReviewer: ' + vals.reviewer_name + ' <' + vals.reviewer_email + '>\\nStatus: ' + vals.status + '\\nSaved at: ' + vals.updated_at + '\\n';\n  for (var i = 0; i < REVIEW_LABELS.length; i++) {\n    var v = vals[REVIEW_LABELS[i][0]];\n    if (v === undefined || v === null || v === '') continue;\n    t += '\\n' + REVIEW_LABELS[i][1] + ':\\n' + unsafeCell_(String(v)) + '\\n';\n  }\n  return t;\n}\n\n/** Independent email copies of a submitted review: one to the reviewer, one to RECEIPT_EMAIL (default REPLY_TO). Never throws. */\nfunction sendReceipts_(rv, appId, stage, status, vals) {\n  var out = { reviewer: false, copy: false };\n  try {\n    var d = appData_(appId, stage) || {}, title = String(d.title || appId).replace(/[\\r\\n]+/g, ' ');\n    var text = reviewText_(vals, title, stage), html = '<p>Your review was received. This is your copy for your records.<\/p><pre style=\"white-space:pre-wrap;font:14px/1.5 Arial,sans-serif\">' + esc_(text) + '<\/pre>';\n    var base = { subject: ('Review ' + (status === 'conflict' ? 'conflict declaration ' : 'submitted: ') + title).substring(0, 150), body: text, htmlBody: html, name: prop_('SENDER_NAME' l_(tos[i]);\n      if (!to || !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(to)) continue;\n      try { MailApp.sendEmail({ to: to, subject: ('Invitation declined: ' + title).replace(/[\\r\\n]+/g, ' ').substring(0, 150), body: text, htmlBody: html, name: prop_('SENDER_NAME', 'AITC Review') }); sent++; } catch (e1) {}\n    }\n    appendAudit_(rv.email, 'decline_notification', appId, stage, sent ? 'sent to ' + sent : 'not sent (no REPLY_TO or ADMINS configured, or mail failed)');\n    return sent;\n  } catch (e) { return 0; }\n}\n\n/* ---------- daily snapshot (pulled by a cron job into a private git repo) ---------- */\n\nfunction constEq_(a, b) {\n  a = String(a); b = String(b);\n  var n = Math.max(a.length, b.length), diff = a.length ^ b.length;\n  for (var i = 0; i < n; i++) diff |= (a.charCodeAt(i) || 0) ^ (b.charCodeAt(i) || 0);\n  return diff === 0;\n}\nfunction csvCell_(v) {\n  if (Object.prototype.toString.call(v) === '[object Date]') v = v.toISOString();\n  var s = String(v === null || v === undefined ? '' : v);\n  return /[\",\\r\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s;\n}\n/** CSV of the Reviews tab or the Submissions log. Any column whose name contains \"token\" is dropped, so links/tokens can never leak. */\nfunction exportSnapshot_(part) {\n  var name = part === 'submissions' ? 'Submissions' : (part === 'reviews' ? 'Reviews' : '');\n  if (!name) return null;\n  var sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name);\n  var vals = sh ? sh.getDataRange().getValues() : [];\n  if (!vals.length) return '';\n  var keep = [], j, lines = [];\n  for (j = 0; j < vals[0].length; j++) if (!/token/i.test(String(vals[0][j]))) keep.push(j);\n  for (var i = 0; i < vals.length; i++) {\n    var cells = [];\n    for (j = 0; j < keep.length; j++) cells.push(csvCell_(vals[i][keep[j]]));\n    lines.push(cells.join(','));\n  }\n  return lines.join('\\n') + '\\n';\n}\nfunction snapshotOut_(p) {\n  var key = prop_('SNAPSHOT_KEY', '');\n  if (!key) return     + ((d.keywords||[]).length?'<dt>Keywords</dt><dd>'+d.keywords.map(esc).join(" · ")+'</dd>':'')+'</dl></div>';
  h += '<div class="card"><h4>'+(stage==="loi"?"Letter of intent":"Application")+' — answers</h4><ul class="qa">'
    + (d.answers||[]).map(a => '<li><div class="q">'+esc(a.q)+'</div><div class="a">'+(a.a===""?'<span style="color:#aab2c0">—</span>':esc(aval(a.q,a.a)))+'</div></li>').join("") + '</ul></div>';
  h += '<div class="card"><h4>Documents</h4>'+((d.documents||[]).length ? '<ul class="docs">'+d.documents.map(x => '<li><span aria-hidden="true">📄</span><span>'+esc(x.label)+'<br><small>'+esc(x.filename)+'</small></span></li>').join("")+'</ul><p class="docnote">Document files are shared separately by the coordinator.</p>' : '<p class="docnote">No documents listed.</p>')+'</div></div>';
  return h;
}

const scale = (name, label) => '<div class="scale" role="radiogroup" aria-label="'+label+'">'
  + [1,2,3,4,5,6,7,8,9].map(n => '<label title="'+n+' — '+DESC[n]+'"><input type="radio" name="'+name+'" value="'+n+'"><span>'+n+'</span></label>').join("")
  + '</div><div class="ends"><span>1 = best</span><span>9 = worst</span></div><p class="desc" data-desc="'+name+'"></p>';
const radios = (name, opts, cls) => '<div class="opts" role="radiogroup">' + opts.map(o => '<label class="opt '+(o[2]||"")+'"><input type="radio" name="'+name+'" value="'+o[0]+'"><span>'+o[1]+'</span></label>').join("") + '</div>';
const ta = (name, label, hint, rows) => '<label class="lbl" for="f_'+name+'">'+label+(hint?' <small>'+hint+'</small>':'')+'</label><textarea id="f_'+name+'" name="'+name+'" rows="'+(rows||3)+'" maxlength="'+MAX_TEXT+'"></textarea><span class="cnt" data-cnt="'+name+'"></span>';
const err = n => '<p class="err" data-err="'+n+'" role="alert"></p>';

function renderForm(stage){
  const t = stage==="loi" ? "LOI review" : "Application review";
  return '<aside class="rf" aria-label="Review form"><div class="rf-head"><b>'+t+'</b><span id="saveInfo"></span></div><div id="bannerSlot"></div>'
  + '<form id="rf" novalidate autocomplete="off">'
  + '<div class="coi-box" id="q_coi"><h3>Conflict of interest</h3><p class="crit" style="margin:0 0 10px;font-size:13px">Before reading further, declare whether you have a conflict with this application (same institution, collaborator, financial interest, personal relationship).</p>'
  + radios("coi_declared",[["none","I have no conflict"],["conflict","I have a conflict","warm"]])
  + '<div id="coiNoteWrap" hidden>'+ta("coi_note","Describe the conflict","(required)",2)+'</div>'+err("coi_declared")+err("coi_note")+'</div>'
  + '<fieldset id="body">'
  + '<div class="qb" id="q_f1"><h3><span class="num">1</span>Importance of the Research</h3><p class="crit">Significance, Innovation</p>'+scale("factor1_score","Importance of the Research score")+err("factor1_score")+ta("factor1_comment","Comment","(optional)")+'</div>'
  + '<div class="qb" id="q_f2"><h3><span class="num">2</span>Rigor and Feasibility</h3><p class="crit">Approach</p>'+scale("factor2_score","Rigor and Feasibility score")+err("factor2_score")+ta("factor2_comment","Comment","(optional)")+'</div>'
  + '<div class="qb" id="q_f3"><h3><span class="num">3</span>Expertise and Resources</h3><p class="crit">Investigators, Environment. Gaps are not scored.</p>'+radios("factor3",[["appropriate","Appropriate"],["gaps","Gaps identified"]])+err("factor3")
  + '<div id="f3Wrap" hidden>'+ta("factor3_explanation","Explain the gaps","(required)")+err("factor3_explanation")+'</div></div>'
  + '<div class="qb" id="q_hs"><h3><span class="num">4</span>Human subjects protections</h3><p class="crit">Additional review criterion — not scored.</p>'+radios("human_subjects",[["acceptable","Acceptable"],["unacceptable","Unacceptable","warm"],["na","Not applicable"]])+err("human_subjects")
  + '<div id="hsWrap" hidden>'+ta("human_subjects_comment","Explain the concern","(required)",2)+err("human_subjects_comment")+'</div></div>'
  + '<div class="qb" id="q_ov"><h3><span class="num">5</span>Overall Impact</h3><p class="crit">Likelihood for the project to exert a sustained, powerful influence on the research field(s) involved.</p>'+scale("overall_impact","Overall Impact score")+err("overall_impact")
  + ta("summary","Summary statement","(required)",4)+err("summary")+ta("strengths","Strengths","(optional)")+ta("weaknesses","Weaknesses","(optional)")+'</div>'
  + '</fieldset><div id="sumErr"></div>'
  + '<div id="retrySlot" aria-live="assertive"></div>'
  + '<div class="actions" id="actions"><button class="btn" type="button" id="btnSave">Save draft</button><button class="btn primary" type="button" id="btnSubmit">Submit review</button><span class="saved" id="savedAt"></span></div>'
  + '<div class="dlrow"><button class="btn sm" type="button" id="btnDownload">Download my review (.txt)</button><span class="docnote">A plain-text copy of what is in the form, saved on your computer.</span></div>'
  + '</form></aside>';
}

function readForm(){
  const f = $("#rf"), r = {};
  FIELDS.forEach(n => {
    const els = f.elements[n];
    if (!els) return;
    if (els.length !== undefined && els.type === undefined) { const c = Array.from(els).find(e => e.checked); r[n] = c ? c.value : ""; }
    else r[n] = els.value;
  });
  ["factor1_score","factor2_score","overall_impact"].forEach(n => r[n] = r[n] === "" ? "" : Number(r[n]));
  return r;
}
function fillForm(r){
  const f = $("#rf");
  FIELDS.forEach(n => {
    const els = f.elements[n]; if (!els) return;
    const v = r && r[n] !== undefined && r[n] !== null ? String(r[n]) : "";
    if (els.length !== undefined && els.type === undefined) Array.from(els).forEach(e => e.checked = e.value === v);
    else els.value = v;
  });
}
function descFor(name, v){
  const p = document.querySelector('[data-desc="'+name+'"]'); if (!p) return;
  p.innerHTML = v ? '<b>'+v+' · '+DESC[v]+'</b> — '+DESC_LONG[v] : '1 = best, 9 = worst. Hover or select a number to see the descriptor.';
}
function syncUI(){
  const r = readForm(), conflict = r.coi_declared === "conflict", ro = CUR.readonly;
  $("#coiNoteWrap").hidden = !conflict;
  $("#f3Wrap").hidden = r.factor3 !== "gaps";
  $("#hsWrap").hidden = r.human_subjects !== "unacceptable";
  $("#body").disabled = ro || conflict;
  $("#q_coi").querySelectorAll("input,textarea").forEach(e => e.disabled = ro);
  $("#actions").hidden = ro;
  $("#btnSubmit").textContent = conflict ? "Submit conflict declaration" : "Submit review";
  $("#btnSubmit").className = "btn " + (conflict ? "warm" : "primary");
  ["factor1_score","factor2_score","overall_impact"].forEach(n => descFor(n, r[n]));
  document.querySelectorAll("[data-cnt]").forEach(c => { const n = (r[c.dataset.cnt] || "").length; c.textContent = n + " / " + MAX_TEXT; c.classList.toggle("hot", n > MAX_TEXT * 0.9); });
}
const totalLen = r => TEXT_FIELDS.reduce((a, n) => a + String(r[n] || "").length, 0);
const totalErr = r => totalLen(r) > MAX_TOTAL ? [["", "Your review is too long in total (" + totalLen(r) + " of " + MAX_TOTAL + " characters). Please shorten it."]] : [];

function validate(r){
  const e = totalErr(r);
  if (!r.coi_declared) e.push(["coi_declared","Please declare whether you have a conflict of interest."]);
  else if (r.coi_declared === "conflict") { if (!r.coi_note.trim()) e.push(["coi_note","Describe the conflict so the coordinator can reassign."]); }
  else {
    if (r.factor1_score==="") e.push(["factor1_score","Choose a score for Importance of the Research (1–9)."]);
    if (r.factor2_score==="") e.push(["factor2_score","Choose a score for Rigor and Feasibility (1–9)."]);
    if (!r.factor3) e.push(["factor3","Choose Appropriate or Gaps identified."]);
    else if (r.factor3==="gaps" && !r.factor3_explanation.trim()) e.push(["factor3_explanation","Explain the gaps you identified."]);
    if (!r.human_subjects) e.push(["human_subjects","Choose Acceptable, Unacceptable, or Not applicable."]);
    else if (r.human_subjects==="unacceptable" && !r.human_subjects_comment.trim()) e.push(["human_subjects_comment","Explain why human subjects protections are unacceptable."]);
    if (r.overall_impact==="") e.push(["overall_impact","Choose an Overall Impact score (1–9)."]);
    if (!r.summary.trim()) e.push(["summary","Write a short summary statement."]);
  }
  return e;
}
function showErrors(errs){
  document.querySelectorAll("[data-err]").forEach(p => p.textContent = "");
  document.querySelectorAll(".bad").forEach(x => x.classList.remove("bad"));
  errs.forEach(([f,m]) => { const p = document.querySelector('[data-err="'+f+'"]'); if (p) { p.textContent = m; if (p.parentElement) p.parentElement.classList.add("bad"); } });
  const s = $("#sumErr");
  s.innerHTML = errs.length ? '<div class="summary-err" role="alert">Please fix '+errs.length+' item'+(errs.length>1?"s":"")+' before submitting:<ul>'+errs.map(([f,m]) => '<li><a href="#" data-goto="'+f+'">'+esc(m)+'</a></li>').join("")+'</ul></div>' : "";
}
function goto(f){
  const el = $("#rf").elements[f]; const t = el && el.length !== undefined && el.type === undefined ? el[0] : el;
  if (t) { t.scrollIntoView({block:"center"}); t.focus(); }
}

function banner(){
  const s = CUR.status, slot = $("#bannerSlot");
  if (s === "submitted") slot.innerHTML = '<div class="banner ok"><b>Submitted</b> '+esc(fmtDate(CUR.updated_at))+'. This review is final.'+(CUR.receipt?' A copy was emailed to you.':'')+' Contact the coordinator if it needs to be reopened.</div>';
  else if (s === "conflict") slot.innerHTML = '<div class="banner warm"><b>Conflict declared</b> '+esc(fmtDate(CUR.updated_at))+'. The coordinator has been notified through the sheet.</div>';
  else slot.innerHTML = CUR.restored ? '<div class="banner info">Restored your unsaved edits from this browser. Press Save draft to keep them.</div>' : "";
}

function openApp(id, stage){
  const app = DATA.applications.find(p => p.application_id===id && p.stage===stage);
  if (!app || !DATA.assignments.some(a => a.application_id===id && a.stage===stage)) return go("");
  renderHeader();
  const rv = revOf(id, stage);
  const status = rv ? rv.status : "none";
  const locked = status === "submitted" || status === "conflict";
  let review = rv ? rv.review : {}, restored = false;
  if (!locked) {
    try {
      const l = JSON.parse(localStorage.getItem(lsKey(id, stage)) || "null");
      if (l && (!rv || (l.ts||0) > Date.parse(rv.updated_at||0))) { review = l.review; restored = true; }
    } catch(e){}
  }
  CUR = {app, stage, id, status, updated_at: rv && rv.updated_at, readonly: locked, restored};
  document.title = app.data.title + " · aitcreview";
  $("#main").innerHTML = '<div class="crumb"><a href="#t='+encodeURIComponent(TOKEN)+'" id="back">← All assignments</a></div><div class="split">'+renderApp(app.data, stage)+renderForm(stage)+'</div>';
  fillForm(review); syncUI(); banner();
  if (rv && !locked) $("#savedAt").textContent = "Draft saved " + fmtDate(rv.updated_at);
  window.scrollTo(0,0);
}

function localSave(){
  if (!CUR || CUR.readonly) return;
  localStorage.setItem(lsKey(CUR.id, CUR.stage), JSON.stringify({ts:Date.now(), review:readForm()}));
  $("#savedAt").textContent = "Unsaved edits kept in this browser";
}

const LABELS = [["coi_declared","Conflict of interest"],["coi_note","Conflict note"],["factor1_score","Factor 1 score (1 = best)"],["factor1_comment","Factor 1 comment"],["factor2_score","Factor 2 score (1 = best)"],["factor2_comment","Factor 2 comment"],["factor3","Factor 3 (expertise and resources)"],["factor3_explanation","Factor 3 explanation"],["human_subjects","Human subjects protections"],["human_subjects_comment","Human subjects comment"],["overall_impact","Overall impact (1 = best)"],["summary","Summary"],["strengths","Strengths"],["weaknesses","Weaknesses"]];
function reviewAsText(){
  const r = readForm(), t = CUR.app && CUR.app.data ? CUR.app.data.title : CUR.id;
  let o = "Review of: " + t + " (" + (CUR.stage === "loi" ? "LOI" : "Full application") + ")\nReviewer: " + ((DATA.reviewer && DATA.reviewer.name) || "") + "\nDownloaded: " + new Date().toISOString() + "\n";
  LABELS.forEach(l => { const v = r[l[0]]; if (v !== "" && v !== undefined && v !== null) o += "\n" + l[1] + ":\n" + v + "\n"; });
  return o;
}
function downloadReview(){
  if (!CUR) return;
  const blob = new Blob([reviewAsText()], {type: "text/plain;charset=utf-8"});
  const a = document.createElement("a"), u = URL.createObjectURL(blob);
  a.href = u; a.download = "aitc-review-" + String(CUR.id).replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40) + "-" + CUR.stage + ".txt";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
function clearRetry(){ const s = $("#retrySlot"); if (s) s.innerHTML = ""; }
function showRetry(submit, why){
  const s = $("#retrySlot"); if (!s) return;
  s.innerHTML = '<div class="banner warm retry" role="alert"><b>' + (submit ? "Not submitted yet" : "Not saved yet") + '</b> - your text is saved in this browser, click Retry.' + (why ? ' <span class="why">(' + esc(why) + ')</span>' : '') + ' <button class="btn warm sm" type="button" id="btnRetry" data-submit="' + (submit ? 1 : 0) + '">Retry</button></div>';
}

async function send(submit){
  const r = readForm();
  if (submit) { const errs = validate(r); showErrors(errs); if (errs.length) { goto(errs[0][0]); return false; } }
  else { const te = totalErr(r); showErrors(te); if (te.length) return false; }
  localSave(); clearRetry();   // the draft is on disk before anything goes over the network
  const btns = [$("#btnSave"), $("#btnSubmit")]; btns.forEach(b => b.disabled = true);
  let res;
  try { res = await api.save({t:TOKEN, application_id:CUR.id, stage:CUR.stage, review:r, submit}); }
  catch(e){ btns.forEach(b => b.disabled = false); showRetry(submit, "no connection to the server"); return false; }
  btns.forEach(b => b.disabled = false);
  if (res && res.error === "invalid_token") { INVALID(); return false; }
  if (res && res.error === "locked") { await reload(); return false; }
  if (res && res.error === "validation") { showErrors((res.details||[]).map(m => ["",m])); $("#sumErr").innerHTML = '<div class="summary-err" role="alert">'+esc((res.details||[]).join("; "))+'</div>'; return false; }
  if (!res || res.error || !res.ok || !res.updated_at || (submit && res.status !== "submitted" && res.status !== "conflict")) {
    showRetry(submit, (res && (res.message || res.error)) ? String(res.message || res.error) : "the server did not confirm"); return false;
  }
  // server acknowledged (ok + updated_at): only now is it safe to drop the local copy and show the new state
  localStorage.removeItem(lsKey(CUR.id, CUR.stage));
  const i = DATA.reviews.findIndex(x => x.application_id===CUR.id && x.stage===CUR.stage);
  const entry = {application_id:CUR.id, stage:CUR.stage, status:res.status, updated_at:res.updated_at, review:r};
  if (i >= 0) DATA.reviews[i] = entry; else DATA.reviews.push(entry);
  CUR.status = res.status; CUR.updated_at = res.updated_at; CUR.restored = false; CUR.receipt = !!res.receipt_sent;
  if (submit) { CUR.readonly = true; syncUI(); banner(); renderHeader(); document.querySelector(".rf").scrollTop = 0; window.scrollTo(0,0); }
  else { $("#savedAt").textContent = "Draft saved " + fmtDate(res.updated_at); banner(); renderHeader(); }
  return true;
}
async function reload(){ const d = await api.me(TOKEN); if (d && !d.error) { DATA = d; route(); } }

function confirmDlg(title, body){
  return new Promise(res => {
    const d = $("#dlg"); $("#dlgT").textContent = title; $("#dlgB").textContent = body;
    const done = v => { d.close(); res(v); };
    $("#dlgYes").onclick = () => done(true); $("#dlgNo").onclick = () => done(false); d.oncancel = () => res(false);
    d.showModal(); $("#dlgNo").focus();
  });
}

document.addEventListener("click", async e => {
  const g = e.target.closest("[data-goto]"); if (g) { e.preventDefault(); goto(g.dataset.goto); return; }
  if (e.target.id === "btnSave") send(false);
  if (e.target.id === "btnRetry") send(e.target.dataset.submit === "1");
  if (e.target.id === "btnDownload") downloadReview();
  if (e.target.id === "btnSubmit") {
    const r = readForm(), errs = validate(r); showErrors(errs);
    if (errs.length) return goto(errs[0][0]);
    const conflict = r.coi_declared === "conflict";
    const ok = await confirmDlg(conflict ? "Submit conflict declaration?" : "Submit this review?", conflict ? "You will be marked as having a conflict and won't be able to review this application." : "Once submitted you can't edit it. Double-check your scores and comments.");
    if (ok) send(true);
  }
});
document.addEventListener("input", e => { if (e.target.closest("#rf")) { syncUI(); localSave(); } });
document.addEventListener("change", e => { if (e.target.closest("#rf")) { syncUI(); localSave(); } });
document.addEventListener("mouseover", e => {
  const l = e.target.closest(".scale label"); if (!l) return;
  const sc = l.closest(".qb"), n = l.querySelector("input"), v = n.value;
  const p = sc.querySelector("[data-desc]"); p.innerHTML = '<b>'+v+' · '+DESC[v]+'</b> — '+DESC_LONG[v];
});
document.addEventListener("mouseout", e => { if (e.target.closest(".scale label") && CUR) syncUI(); });
document.addEventListener("focusin", e => { if (e.target.matches(".scale input")) { const v = e.target.value; e.target.closest(".qb").querySelector("[data-desc]").innerHTML = '<b>'+v+' · '+DESC[v]+'</b> — '+DESC_LONG[v]; } });
document.addEventListener("focusout", e => { if (e.target.matches(".scale input") && CUR) syncUI(); });

/* ---------------- routing ---------------- */
function go(h){ location.hash = h || ("#t=" + encodeURIComponent(TOKEN)); }
function route(){
  if (!DATA) return;
  const hp = hashParams(), ht = hp.get("t");
  if (ht && ht !== TOKEN) { TOKEN = ht; DATA = null; CUR = null; load(); return; }
  const id = hp.get("a"), st = hp.get("s"), rs = parseRespond(hp.get("respond"));
  if (rs) showInvitation(rs.id, rs.stage, hp.get("act")); else if (id && (st === "loi" || st === "full")) openApp(id, st); else renderList();
}
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", () => {});

/* ---------------- demo bar ---------------- */
if (GS_DEMO) { initGsDemoBar(); }
if (MOCK) {
  $("#demobar").hidden = false;
  if (!TOKEN) { TOKEN = MOCK.reviewers[0].token; history.replaceState(null, "", location.pathname + "#t=" + encodeURIComponent(TOKEN)); }
  const sel = $("#who");
  sel.innerHTML = MOCK.reviewers.map(r => '<option value="'+esc(r.token)+'">'+esc(r.name)+'</option>').join("");
  sel.value = TOKEN;
  sel.addEventListener("change", () => { TOKEN = sel.value; history.replaceState(null, "", location.pathname + "#t=" + encodeURIComponent(TOKEN)); DATA = null; load(); });
  $("#resetDemo").addEventListener("click", () => { Object.keys(localStorage).filter(k => k.startsWith("aitc-")).forEach(k => localStorage.removeItem(k)); load(); });
}
load();
</script>
</body>
</html>
